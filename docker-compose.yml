version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cod_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cod_user
      POSTGRES_PASSWORD: cod_password
      POSTGRES_DB: cod_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cod_user -d cod_db']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cod_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TZ: Africa/Casablanca
      DATABASE_URL: postgresql://cod_user:cod_password@postgres:5432/cod_db
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config:ro   # for service-account.json
    ports:
      - '3000:3000'
    command: >
      sh -c "npx prisma migrate deploy && node dist/server.js"

volumes:
  postgres_data:
