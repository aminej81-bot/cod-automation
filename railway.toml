# Force Railway to use the Dockerfile instead of Nixpacks auto-detection.
# Without this file Railway may fall back to Nixpacks, which performs its own
# production-only npm prune in the final image layer and can break subpath
# package exports like `dotenv/config`.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "npx prisma db push && node dist/server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
